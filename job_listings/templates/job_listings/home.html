{% extends "job_listings/base.html" %}
{% block content %}
    {% for post in jobs_list %}
    <!-- <h1>{{ post.post_title }}</h1> -->
    <article class="media content-section d-flex align-items-center mb-2 ">
      <!-- <img class="rounded-circle article-img mr-3" src="{{ post.author.profile.image.url }}"> -->
      <div class="media-body">
        <div class="article-metadata">
          <a class="mr-2" href="#">{{ post.posted_by }}</a>
          <small class="text-muted">{{ post.pub_date|date:"F d, Y" }}</small>
        </div>
        <h2><a class="article-title" href="#">{{ post.post_title }}</a></h2>
        <p class="article-content">{{ post.job_desc }}</p>
      </div>
    </article>
    {% endfor %}
{% endblock content %}
